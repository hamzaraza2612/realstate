# Production Docker Compose stack. `docker compose up -d --build` brings up the complete
# application (Postgres, Redis, API, frontend, reverse-proxy Nginx) with no host dependency
# beyond Docker and Docker Compose — the API applies its own EF Core migrations and seeds the
# Super Admin account on startup, so no manual migration step is required.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realestate_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  api:
    build:
      context: .
      dockerfile: backend/src/Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${CONNECTION_STRING:?CONNECTION_STRING is required}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-RealEstateErp}
      Jwt__Audience: ${JWT_AUDIENCE:-RealEstateErpClient}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      SuperAdmin__Email: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL is required}
      SuperAdmin__Password: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required}
      SeedDemoData: ${SEED_DEMO_DATA:-false}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS__0:-http://localhost}
      Redis__ConnectionString: redis:6379
      Storage__LocalPath: /app/data/uploads
    volumes:
      - uploads-data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [backend-net]

  # One-off migration runner: `docker compose --profile tools run --rm migrate`. Not started by
  # `docker compose up` (the api container already migrates itself on boot) — this is here so
  # migrations can be applied as an explicit, separate step when an operator wants that control
  # (e.g. running the migration before rolling out a new api image to multiple replicas).
  migrate:
    build:
      context: .
      dockerfile: backend/src/Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__Default: ${CONNECTION_STRING:?CONNECTION_STRING is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend-net]
    restart: "no"
    profiles: ["tools"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [backend-net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [backend-net]

volumes:
  postgres-data:
  uploads-data:

networks:
  backend-net:
